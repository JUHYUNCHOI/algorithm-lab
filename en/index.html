<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algorithm Lab</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <link rel="stylesheet" href="../style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/cpp.min.js"></script>
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h1 class="logo">Algorithm <span>Lab</span></h1>
        </div>
        <div class="sidebar-selectors">
            <div class="sidebar-selector-row">
                <span class="sidebar-selector-label">🌐</span>
                <div class="selector-group" id="locale-selector">
                    <button class="selector-btn" data-locale="ko">한국어</button>
                    <button class="selector-btn active" data-locale="en">English</button>
                </div>
            </div>
            <div class="sidebar-selector-row">
                <span class="sidebar-selector-label">💻</span>
                <div class="selector-group" id="lang-selector">
                    <button class="selector-btn active" data-lang="python">🐍 Python</button>
                    <button class="selector-btn" data-lang="cpp">⚡ C++</button>
                </div>
            </div>
        </div>
        <nav class="sidebar-nav" id="sidebar-nav">
            <!-- JS renders topic list -->
        </nav>
        <div class="sidebar-footer">
            <span class="sidebar-badge">Learning Platform</span>
        </div>
    </aside>

    <div class="layout">
        <header id="topic-header">
            <div class="header-left">
                <button class="sidebar-toggle" id="sidebar-toggle">☰</button>
                <h2 id="topic-title">Select a topic</h2>
            </div>
            <nav class="tab-nav" id="tab-nav">
                <!-- JS renders tab buttons -->
            </nav>
        </header>

        <main id="content">
            <div class="empty-state">
                <div class="empty-icon">📚</div>
                <h2>Ready to learn algorithms?</h2>
                <p>Select a topic from the left sidebar to get started</p>
            </div>
        </main>
    </div>

    <!-- Phase 1: Data Structures -->
    <script src="topics/string.js"></script>
    <script src="topics/array.js"></script>
    <script src="topics/hashtable.js"></script>
    <script src="topics/stackqueue.js"></script>
    <script src="topics/linkedlist.js"></script>
    <!-- Phase 2: Sorting & Searching -->
    <script src="topics/sorting.js"></script>
    <script src="topics/binarysearch.js"></script>
    <!-- Phase 3: Recursion & Trees -->
    <script src="topics/recursion.js"></script>
    <script src="topics/tree.js"></script>
    <!-- Phase 4: Algorithm Techniques -->
    <script src="topics/backtracking.js"></script>
    <script src="topics/divideconquer.js"></script>
    <script src="topics/greedy.js"></script>
    <script src="topics/dp.js"></script>
    <script src="topics/prefixsum.js"></script>
    <!-- Phase 5: Advanced DS & Graphs -->
    <script src="topics/priorityqueue.js"></script>
    <script src="topics/graph.js"></script>
    <script src="topics/topologicalsort.js"></script>
    <script src="topics/shortestpath.js"></script>
    <!-- Phase 6: Advanced Topics -->
    <script src="topics/bitmanipulation.js"></script>
    <script src="topics/trie.js"></script>
    <script src="topics/unionfind.js"></script>
    <!-- App -->
    <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algorithm Lab</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/cpp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/java.min.js"></script>
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h1 class="logo">Algorithm <span>Lab</span></h1>
        </div>
        <nav class="sidebar-nav" id="sidebar-nav">
            <!-- JS가 주제 목록을 렌더링 -->
        </nav>
        <div class="sidebar-footer">
            <span class="sidebar-badge">학습 플랫폼</span>
        </div>
    </aside>

    <div class="layout">
        <header id="topic-header">
            <div class="header-left">
                <button class="sidebar-toggle" id="sidebar-toggle">☰</button>
                <h2 id="topic-title">주제를 선택하세요</h2>
            </div>
            <nav class="tab-nav" id="tab-nav">
                <!-- JS가 탭 버튼을 렌더링 -->
            </nav>
        </header>

        <main id="content">
            <div class="empty-state">
                <div class="empty-icon">📚</div>
                <h2>알고리즘 학습을 시작해볼까요?</h2>
                <p>왼쪽 사이드바에서 학습할 주제를 선택하세요</p>
            </div>
        </main>
    </div>

    <!-- Phase 1: 자료구조 활용 -->
    <script src="topics/string.js"></script>
    <script src="topics/array.js"></script>
    <script src="topics/hashtable.js"></script>
    <script src="topics/stackqueue.js"></script>
    <script src="topics/linkedlist.js"></script>
    <!-- Phase 2: 정렬과 탐색 -->
    <script src="topics/sorting.js"></script>
    <script src="topics/binarysearch.js"></script>
    <!-- Phase 3: 재귀와 트리 -->
    <script src="topics/recursion.js"></script>
    <script src="topics/tree.js"></script>
    <!-- Phase 4: 알고리즘 기법 -->
    <script src="topics/backtracking.js"></script>
    <script src="topics/divideconquer.js"></script>
    <script src="topics/greedy.js"></script>
    <script src="topics/dp.js"></script>
    <script src="topics/prefixsum.js"></script>
    <!-- Phase 5: 고급 자료구조와 그래프 -->
    <script src="topics/priorityqueue.js"></script>
    <script src="topics/graph.js"></script>
    <script src="topics/topologicalsort.js"></script>
    <script src="topics/shortestpath.js"></script>
    <!-- Phase 6: 심화 선택 -->
    <script src="topics/bitmanipulation.js"></script>
    <script src="topics/trie.js"></script>
    <script src="topics/unionfind.js"></script>
    <!-- App -->
    <script src="app.js"></script>
</body>
</html>
